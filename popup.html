<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    :root{
      --bg:#101014; --surface:#18181e; --surface-2:#202028; --border:#2a2a34;
      --text:#ececf2; --muted:#9696a6; --faint:#5f5f6e;
      --accent:#7c5cd6; --accent-hover:#8d70e0; --accent-soft:rgba(124,92,214,.14); --on-accent:#fff;
      --warn-bg:rgba(230,170,60,.10); --warn-line:#d9a441; --warn-ink:#e9c477;
      --ok:#6fcf8f; --err:#ef7b7b;
      --r:8px; --r-sm:6px;
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg:#ffffff; --surface:#f6f6f9; --surface-2:#ececf2; --border:#e1e1e8;
        --text:#17171c; --muted:#62626f; --faint:#9a9aa6;
        --accent:#6a48c9; --accent-hover:#5a3bb5; --accent-soft:rgba(106,72,201,.10);
        --warn-bg:#fdf6e7; --warn-line:#d9a441; --warn-ink:#7a5410;
        --ok:#1f8a4c; --err:#c63d3d;
      }
    }

    *{margin:0;padding:0;box-sizing:border-box}
    body{
      width:320px; background:var(--bg); color:var(--text);
      font:13px/1.45 system-ui,'Segoe UI',Tahoma,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button{font:inherit;color:inherit}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

    /* ── HEADER ── */
    .header{display:flex;align-items:center;gap:10px;padding:14px 16px 12px}
    .header-icon{
      width:28px;height:28px;border-radius:7px;background:var(--accent);
      display:flex;align-items:center;justify-content:center;flex-shrink:0;
    }
    .header h1{font-size:14px;font-weight:650;letter-spacing:-.01em}
    .header p{font-size:11px;color:var(--muted)}
    .btn-settings{
      margin-inline-start:auto;width:30px;height:30px;border-radius:var(--r-sm);
      background:none;border:none;cursor:pointer;color:var(--muted);
      display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;
    }
    .btn-settings:hover{background:var(--surface-2);color:var(--text)}
    .btn-settings.active{background:var(--accent-soft);color:var(--accent)}

    /* ── TABS (segmented) ── */
    .tabs{
      display:flex;gap:2px;margin:0 16px;padding:3px;
      background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    }
    .tab{
      flex:1;padding:6px 0;text-align:center;font-size:12px;font-weight:550;
      color:var(--muted);cursor:pointer;border-radius:var(--r-sm);user-select:none;
      transition:background .15s,color .15s;
    }
    .tab:hover{color:var(--text)}
    .tab.active{background:var(--surface-2);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.18)}

    /* ── PANELS ── */
    .panel{display:none;padding:14px 16px 16px}
    .panel.active{display:block}
    .panel-label{
      font-size:11px;font-weight:600;color:var(--muted);
      margin:16px 0 8px;
    }
    .panel > .panel-label:first-child{margin-top:0}

    /* ── DIRECT PLAYER ROW ── */
    .mode-card{
      background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
      padding:12px;transition:border-color .2s;
    }
    .mode-card.enabled{border-color:color-mix(in srgb,var(--accent) 55%,var(--border))}
    .mode-top{display:flex;align-items:center;gap:12px}
    .mode-icon{display:none}
    .mode-text{flex:1;min-width:0}
    .mode-title{font-size:13px;font-weight:600}
    .mode-desc{font-size:11.5px;color:var(--muted);margin-top:2px}

    .toggle{
      position:relative;width:34px;height:20px;flex-shrink:0;cursor:pointer;
      background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
      transition:background .2s,border-color .2s;
    }
    .toggle::after{
      content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
      background:var(--muted);transition:left .2s,background .2s;
    }
    .toggle.on{background:var(--accent);border-color:var(--accent)}
    .toggle.on::after{left:16px;background:var(--on-accent)}
    [dir=rtl] .toggle::after{left:16px}
    [dir=rtl] .toggle.on::after{left:2px}

    .mode-warning{
      display:none;margin-top:10px;padding:8px 10px;
      background:var(--warn-bg);border-inline-start:2px solid var(--warn-line);
      border-radius:var(--r-sm);font-size:11.5px;color:var(--warn-ink);line-height:1.5;
    }
    .mode-warning.show{display:block}
    .mode-warning strong{font-weight:600}

    /* ── SITES ── */
    .add-row{display:flex;gap:6px}
    input[type=text],.send-area{
      width:100%;background:var(--surface);border:1px solid var(--border);
      border-radius:var(--r-sm);color:var(--text);font:inherit;font-size:12.5px;direction:ltr;
      transition:border-color .15s;
    }
    input[type=text]{flex:1;padding:7px 10px}
    input[type=text]:focus,.send-area:focus{outline:none;border-color:var(--accent)}
    input::placeholder,textarea::placeholder{color:var(--faint)}
    .btn-add{
      width:34px;flex-shrink:0;border:none;border-radius:var(--r-sm);
      background:var(--accent);color:var(--on-accent);font-size:16px;cursor:pointer;transition:background .15s;
    }
    .btn-add:hover{background:var(--accent-hover)}

    .sites-list{
      margin-top:8px;max-height:176px;overflow-y:auto;
      border:1px solid var(--border);border-radius:var(--r);
    }
    .sites-list:empty{display:none}
    .sites-list::-webkit-scrollbar{width:4px}
    .sites-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
    .site-item{display:flex;align-items:center;gap:10px;padding:8px 10px}
    .site-item + .site-item{border-top:1px solid var(--border)}
    .site-item:hover{background:var(--surface)}
    .site-dot{order:-1;width:6px;height:6px;border-radius:50%;background:var(--ok);flex-shrink:0}
    .site-host{flex:1;font-size:12.5px;direction:ltr;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    [dir=rtl] .site-host{text-align:right}
    .btn-remove{
      background:none;border:none;color:var(--faint);cursor:pointer;
      font-size:13px;line-height:1;padding:3px 5px;border-radius:4px;opacity:0;transition:opacity .15s,color .15s;
    }
    .site-item:hover .btn-remove,.btn-remove:focus-visible{opacity:1}
    .btn-remove:hover{color:var(--err)}
    .empty-msg{text-align:center;color:var(--faint);font-size:12px;padding:16px 0}

    .add-current-btn{
      width:100%;margin-top:8px;padding:7px;text-align:center;font-size:12px;
      background:none;border:1px dashed var(--border);border-radius:var(--r-sm);
      color:var(--muted);cursor:pointer;transition:border-color .15s,color .15s;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    .add-current-btn:hover{border-color:var(--accent);color:var(--accent)}
    .add-current-btn.hidden{display:none}

    /* ── SEND ── */
    .send-area{padding:9px 10px;height:84px;resize:none;font-family:ui-monospace,Consolas,monospace;font-size:11.5px}
    .btn-open{
      width:100%;margin-top:8px;padding:9px;border:none;border-radius:var(--r-sm);
      background:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer;transition:background .15s;
    }
    .btn-open:hover{background:var(--accent-hover)}
    .send-status{font-size:11.5px;margin-top:8px;min-height:16px;text-align:center}
    .send-status.ok{color:var(--ok)}
    .send-status.err{color:var(--err)}

    /* ── SETTINGS ── */
    .lang-switch{
      display:flex;gap:2px;padding:3px;
      background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    }
    .lang-btn{
      flex:1;padding:6px;border:none;border-radius:var(--r-sm);background:none;
      color:var(--muted);font-size:12.5px;cursor:pointer;transition:background .15s,color .15s;
    }
    .lang-btn:hover{color:var(--text)}
    .lang-btn.active{background:var(--surface-2);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.18)}

    /* ── TOAST ── */
    .toast{
      position:fixed;bottom:12px;left:50%;transform:translate(-50%,6px);
      color:#fff;padding:6px 14px;border-radius:var(--r-sm);font-size:12px;
      opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;
      box-shadow:0 4px 14px rgba(0,0,0,.25);
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}
  </style>
</head>
<body>

<div class="header">
  <div class="header-icon">
    <svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 1.5v9l7.5-4.5z" fill="#fff"/></svg>
  </div>
  <div>
    <h1>Magnet to Stremio</h1>
    <p data-i18n="headerSub"></p>
  </div>
  <button class="btn-settings" id="settingsBtn" data-i18n-title="settings">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
</div>

<div class="tabs">
  <div class="tab active" data-tab="sites" data-i18n="tabSites"></div>
  <div class="tab" data-tab="send" data-i18n="tabSend"></div>
</div>

<!-- ══════ SITES PANEL ══════ -->
<div class="panel active" id="panel-sites">

  <!-- وضع المشغل المباشر -->
  <div class="mode-card" id="modeCard">
    <div class="mode-top">
      <div class="mode-icon"></div>
      <div class="mode-text">
        <div class="mode-title" data-i18n="modeTitle"></div>
        <div class="mode-desc" data-i18n="modeDesc"></div>
      </div>
      <div class="toggle" id="directToggle" role="switch" aria-checked="false"></div>
    </div>
    <div class="mode-warning" id="modeWarning" data-i18n-html="modeWarning"></div>
  </div>

  <!-- إضافة موقع -->
  <p class="panel-label" data-i18n="sitesLabel"></p>
  <div class="add-row">
    <input type="text" id="siteInput" data-i18n-placeholder="sitePlaceholder"/>
    <button class="btn-add" id="addSiteBtn">+</button>
  </div>
  <div class="sites-list" id="sitesList"></div>
  <button class="add-current-btn hidden" id="addCurrentBtn"></button>
</div>

<!-- ══════ SEND PANEL ══════ -->
<div class="panel" id="panel-send">
  <p class="panel-label" data-i18n="sendLabel"></p>
  <textarea class="send-area" id="magnetInput"
    placeholder="magnet:?xt=urn:btih:..."></textarea>
  <button class="btn-open" id="openBtn" data-i18n="openBtn"></button>
  <div class="send-status" id="sendStatus"></div>
</div>

<!-- ══════ SETTINGS PANEL ══════ -->
<div class="panel" id="panel-settings">
  <p class="panel-label" data-i18n="language"></p>
  <div class="lang-switch">
    <button class="lang-btn" data-lang="en">English</button>
    <button class="lang-btn" data-lang="ar">العربية</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="pako.min.js"></script>
<script src="utils.js"></script>
<script src="popup.js"></script>
</body>
</html>
